name: CI

# test:        unit tests, type check and lint. They need no network and no reading model.
#              macOS is the verified platform and decides the result. Linux and Windows run too,
#              but are not verified yet, so a failure there is shown and does not fail the workflow.
# acceptance:  the end-to-end script: the real commands (init, sync, search, status, rebuild, doctor)
#              on the invented fixture vault, with a checksum of the vault compared after every
#              command, a forced stop in the middle of a sync, and two syncs racing. It downloads the
#              reading model once and caches it. It runs on macOS, Linux and Windows. None of the three
#              is a required check yet.
# member:      the first ten minutes of a new member: install with the README's line (pointed at this
#              commit), then doctor, init, sync, status, search, edit, sync, search on a small invented
#              vault whose path has a space and whose notes have non-English names. Real output and
#              timings go to the job log. Not a required check yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Remove a platform from this condition once it has a green run on record.
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      # Never --omit=optional: the native engine is an optional package.
      - run: npm ci
      # The glob is left to bash, so the same line works on every Node version in the matrix.
      - name: Unit tests
        run: node --test tests/unit/*.test.js
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  acceptance:
    name: Acceptance, ${{ matrix.label }}, Node 22
    runs-on: ${{ matrix.os }}
    # A small hosted runner has no reader pool and needs about half an hour for the whole script.
    timeout-minutes: 60
    # These jobs are new on hosted runners, and some of their steps have time limits that were set
    # on a faster machine. Until a system has one green run on record it reports without failing
    # the workflow. Narrow the next line once it does, so the badge covers it.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS }
          - { os: ubuntu-latest, label: Linux }
          - { os: windows-latest, label: Windows }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Cache the reading model
        uses: actions/cache@v4
        with:
          path: ~/.ruvector/models
          key: reading-model-${{ runner.os }}-${{ hashFiles('src/embed/models.js') }}
      - run: npm ci
      - name: Doctor (loads the native engine; downloads the reading model on a cache miss)
        run: node bin/vault-mirror.js doctor
      # The debug log holds no note text, no note names and no search questions.
      - name: Show doctor's debug log when it failed
        if: failure()
        run: cat ~/.vault-mirror/logs/debug.log || true
      - name: TEMPORARY engine diagnosis
        if: ${{ !cancelled() }}
        run: node tests/acceptance/diagnose-engine.mjs
      # Runs after a failed doctor too: the job still fails, and the log says how far the real commands get.
      - name: Acceptance (end to end on the invented fixture vault)
        if: ${{ !cancelled() }}
        run: node tests/acceptance/run.mjs --vault tests/fixtures/vault

  member:
    name: Member install, ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    # New on hosted runners. Narrow this once a system has a green run on record.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Cache the reading model
        uses: actions/cache@v4
        with:
          path: ~/.ruvector/models
          key: reading-model-${{ runner.os }}-${{ hashFiles('src/embed/models.js') }}
      - name: Install with the README's line, pointed at this commit
        shell: bash
        run: npm install -g "github:${{ github.event.pull_request.head.repo.full_name || github.repository }}#${{ github.event.pull_request.head.sha || github.sha }}"
      - name: The command answers in PowerShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: vault-mirror --version
      - name: The command answers in the Windows command prompt
        if: runner.os == 'Windows'
        shell: cmd
        run: vault-mirror --version
      - name: The command answers in bash
        shell: bash
        run: vault-mirror --version
      - name: TEMPORARY engine diagnosis
        if: runner.os == 'Windows'
        shell: bash
        run: npm ci --no-audit --no-fund && node --expose-gc tests/acceptance/diagnose-engine.mjs
      # No shell is set: PowerShell on Windows, bash elsewhere, as a member would have it.
      - name: The first ten minutes of a member (real output and timings)
        run: node tests/acceptance/member-smoke.mjs --installed --default-home
