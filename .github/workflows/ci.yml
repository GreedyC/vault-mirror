name: CI

# test:        unit tests, type check and lint. They need no network and no reading model.
#              macOS is the verified platform and decides the result. Linux and Windows run too,
#              but are not verified yet, so a failure there is shown and does not fail the workflow.
# acceptance:  the end-to-end script: the real commands (init, sync, search, status, rebuild, doctor)
#              on the invented fixture vault, with a checksum of the vault compared after every
#              command, a forced stop in the middle of a sync, and two syncs racing. It downloads the
#              reading model once and caches it. It runs on macOS, Linux and Windows. None of the three
#              is a required check yet.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    # Remove a platform from this condition once it has a green run on record.
    continue-on-error: ${{ matrix.os != 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        node: [20, 22, 24]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      # Never --omit=optional: the native engine is an optional package.
      - run: npm ci
      # The glob is left to bash, so the same line works on every Node version in the matrix.
      - name: Unit tests
        run: node --test tests/unit/*.test.js
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  acceptance:
    name: Acceptance, ${{ matrix.label }}, Node 22
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    # These jobs are new on hosted runners, and some of their steps have time limits that were set
    # on a faster machine. Until a system has one green run on record it reports without failing
    # the workflow. Narrow the next line once it does, so the badge covers it.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, label: macOS }
          - { os: ubuntu-latest, label: Linux }
          - { os: windows-latest, label: Windows }
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Cache the reading model
        uses: actions/cache@v4
        with:
          path: ~/.ruvector/models
          key: reading-model-${{ runner.os }}-${{ hashFiles('src/embed/models.js') }}
      - run: npm ci
      - name: Doctor (loads the native engine; downloads the reading model on a cache miss)
        run: node bin/vault-mirror.js doctor
      - name: Acceptance (end to end on the invented fixture vault)
        run: node tests/acceptance/run.mjs --vault tests/fixtures/vault
